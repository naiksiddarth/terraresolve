# TerraResolve default config -- CNN (EDSR) baseline.
#
# Every block below is resolved from a registry BY NAME
# (terraresolve/registry.py). Swap a piece of the pipeline by editing
# the "name" field, not the code:
#   - model.name        -> edsr | swinir            (terraresolve/models/)
#   - loss.terms         -> l1 | l2 | ssim | sam      (terraresolve/losses/) any combo, any weights
#   - data.type           -> paired_real | synthetic_degrade (terraresolve/data/)
#   - eval.metrics        -> psnr | ssim | cc | ergas | sam  (terraresolve/metrics/)
#   - downstream.task     -> ndwi_water | ndvi_vegetation    (terraresolve/downstream/)
#
# See configs/swinir.yaml for a full alternate config, and README.md
# for the complete swap-in/swap-out guide.

model:
  name: edsr
  params:
    in_channels: 4        # Sentinel-2 B2/B3/B4/B8 == Blue/Green/Red/NIR
    n_feats: 64
    n_resblocks: 16
    scale: 4               # 10m -> 2.5m; raise for a more aggressive target
    res_scale: 0.1

loss:
  terms:                  # name: weight -- add/remove/reweight freely
    l1: 1.0
    ssim: 0.2
    sam: 0.1
  term_kwargs:
    ssim:
      channels: 4

data:
  type: synthetic_degrade  # no real LR needed yet -- degrades HR on the fly.
  params:                  # switch to paired_real once you have SEN2NAIP (or similar) unpacked locally.
    hr_dir: data/hr_reference
    patch_size: 64
    scale: 4
    augment: true

optimizer:
  lr: 0.0001

train:
  epochs: 50
  batch_size: 8
  num_workers: 2
  checkpoint_dir: checkpoints

eval:
  metrics: [psnr, ssim, cc, ergas, sam]

downstream:
  task: ndwi_water
  params:
    threshold: 0.0

inference:
  patch_size: 64
  overlap: 8

device: auto              # auto | cuda | cpu
