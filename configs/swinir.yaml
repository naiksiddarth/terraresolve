# Same pipeline, transformer backbone instead of CNN. This is the
# entire diff needed to switch architectures -- everything else
# (loss, data, metrics, training loop) is untouched.
model:
  name: swinir
  params:
    in_channels: 4
    n_feats: 60
    n_blocks: 6
    window_size: 8
    num_heads: 4
    scale: 4

loss:
  terms:
    l1: 1.0
    ssim: 0.2
    sam: 0.1
  term_kwargs:
    ssim:
      channels: 4

data:
  type: synthetic_degrade
  params:
    hr_dir: data/hr_reference
    patch_size: 64
    scale: 4
    augment: true

optimizer:
  lr: 0.0001

train:
  epochs: 50
  batch_size: 4          # attention is heavier than the CNN -- smaller batch by default
  num_workers: 2
  checkpoint_dir: checkpoints

eval:
  metrics: [psnr, ssim, cc, ergas, sam]

downstream:
  task: ndwi_water
  params:
    threshold: 0.0

inference:
  patch_size: 64
  overlap: 8

device: auto
